<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0d0f" />
  <title>Link in Bio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="layout">

    <!-- HERO -->
    <aside class="hero" id="hero">
      <div class="hero-background" id="hero-slider"></div>
      <div class="hero-overlay"></div>

      <div class="hero-content">
        <div class="hero-top">
          <div class="avatar" id="avatar"></div>

          <span class="badge" id="badge"></span>
        </div>

        <div class="hero-info">
          <h1 id="hero-title"></h1>
          <p id="hero-description"></p>

          <a class="hero-cta" id="hero-cta" target="_blank" rel="noopener">
            <span id="cta-label"></span>
            <span>↗</span>
          </a>
        </div>

        <div class="socials" id="socials"></div>
      </div>
    </aside>

    <!-- CONTENT -->
    <section class="main-content">
      <div class="section-header">
        <span class="section-eyebrow" id="section-eyebrow"></span>
        <h2 id="section-title"></h2>
        <p id="section-description"></p>
      </div>

      <div class="links-grid" id="links-container"></div>

      <div class="cards-section">
        <div class="section-header compact">
          <span class="section-eyebrow" id="cards-eyebrow"></span>
          <h2 id="cards-title"></h2>
        </div>

        <div class="cards-grid" id="cards-container"></div>
      </div>

      <footer id="footer"></footer>
    </section>

  </main>

  <script src="content.js"></script>
</body>
</html>
